version: 2

models:
  - name: stg_clienti
    description: "Cleaned and standardized customer data"
    columns:
      - name: codice_cliente
        description: "Primary key - unique customer identifier"
        tests:
          - unique
          - not_null

      - name: eta
        description: "Customer age"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 18
              max_value: 100

      - name: engagement_score
        description: "Customer engagement score (0-100)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

      - name: churn_probability
        description: "Probability of customer churn (0-1)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

      - name: satisfaction_score
        description: "Customer satisfaction score (0-100)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

  - name: stg_polizze
    description: "Cleaned and standardized policy data"
    columns:
      - name: codice_cliente
        description: "Foreign key to customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_clienti')
              field: codice_cliente

      - name: premio_totale_annuo
        description: "Total annual premium"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: loss_ratio
        description: "Loss ratio - should be between 0 and 1 for normal cases"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5  # Allow some outliers

  - name: stg_sinistri
    description: "Cleaned claims data (null values filtered)"
    columns:
      - name: codice_cliente
        description: "Foreign key to customers"
        tests:
          - relationships:
              to: ref('stg_clienti')
              field: codice_cliente

  - name: stg_interazioni_clienti
    description: "Cleaned customer interactions data"
    columns:
      - name: codice_cliente
        description: "Foreign key to customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_clienti')
              field: codice_cliente

      - name: data_interazione
        description: "Date of interaction"
        tests:
          - not_null

  - name: stg_client_nba_enhanced
    description: "Cleaned NBA (Next Best Action) recommendations from external analytics - excludes duplicated customer attributes"
    columns:
      - name: codice_cliente
        description: "Primary key - customer identifier"
        tests:
          - not_null
          - relationships:
              to: ref('stg_clienti')
              field: codice_cliente

      - name: segmento_strategico
        description: "Strategic customer segment combining value, life stage, and product ownership"
        tests:
          - not_null

      - name: raccomandazione_nba
        description: "Next Best Action - recommended product(s) to pitch to the customer"
        tests:
          - not_null

      - name: livello_urgenza
        description: "Urgency level for acting on the recommendation"
        tests:
          - not_null
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']

      - name: cluster
        description: "Customer cluster assignment from segmentation analysis"
        tests:
          - not_null

      - name: tasso_conversione_nba
        description: "Historical conversion rate for this customer (0-1)"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

      - name: possiede_casa
        description: "Binary flag: 1 if customer owns Casa (home) insurance, 0 otherwise"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: possiede_salute
        description: "Binary flag: 1 if customer owns Salute (health) insurance, 0 otherwise"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: possiede_investimento
        description: "Binary flag: 1 if customer owns investment products, 0 otherwise"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: possiede_pip
        description: "Binary flag: 1 if customer owns PIP (pension) products, 0 otherwise"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
