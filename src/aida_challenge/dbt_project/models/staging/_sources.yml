version: 2

sources:
  - name: analytics
    description: "Analytical tables and enriched datasets generated by Python analytics scripts"
    schema: analytics
    tables:
      - name: customer_clusters
        description: "Customer cluster assignments from K-means clustering of high-value clients"
        columns:
          - name: codice_cliente
            description: "Unique customer identifier"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: cluster
            description: "Cluster numeric ID (-1 for non-clustered customers)"
            tests:
              - not_null
          - name: versione_modello
            description: "Model version (format: vYYYYMM)"
            tests:
              - not_null

      - name: cluster_metadata
        description: "Cluster semantic labels and characteristics"
        columns:
          - name: cluster_id
            description: "Cluster numeric ID"
            tests:
              - not_null
          - name: versione_modello
            description: "Model version"
            tests:
              - not_null
          - name: etichetta_cluster
            description: "Human-readable semantic label for cluster"
            tests:
              - not_null
          - name: num_clienti
            description: "Number of customers in this cluster"
          - name: silhouette_score
            description: "Clustering quality score"
          - name: caratteristiche_json
            description: "JSON string with cluster centroid features"

      - name: cluster_summary
        description: "Cluster centroid feature means for analytics"
        columns:
          - name: cluster
            description: "Cluster numeric ID"
            tests:
              - not_null
          - name: versione_modello
            description: "Model version"
            tests:
              - not_null

      - name: nba_enhanced
        description: "Enhanced NBA recommendations with cluster insights and channel preferences"
        columns:
          - name: codice_cliente
            description: "Unique customer identifier"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: cluster_id
            description: "Assigned cluster ID"
          - name: raccomandazione_nba_cluster
            description: "Cluster-aware NBA recommendation"
          - name: livello_urgenza_adjusted
            description: "Urgency tier adjusted for responsiveness"
          - name: canale_migliore
            description: "Best contact channel based on conversion history"
          - name: versione_modello
            description: "Model version"

      - name: cluster_product_mix
        description: "Product ownership proportions by cluster"
        columns:
          - name: cluster
            description: "Cluster numeric ID"
          - name: possiede_casa
            description: "Proportion of cluster owning Casa products"
          - name: possiede_salute
            description: "Proportion of cluster owning Salute products"
          - name: possiede_investimento
            description: "Proportion of cluster owning Investimento products"
          - name: possiede_pip
            description: "Proportion of cluster owning PIP products"
          - name: versione_modello
            description: "Model version"

      - name: client_nba_enhanced
        description: "[LEGACY] Enhanced customer data with Next Best Action recommendations and strategic segmentation"
        columns:
          - name: codice_cliente
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: strategic_segment
            description: "Strategic customer segment"
          - name: nba_recommendation
            description: "Next Best Action recommendation"
          - name: urgency_tier
            description: "Urgency level for the recommendation"
          - name: cluster
            description: "Customer cluster assignment"
          - name: conversion_rate
            description: "Expected conversion rate for NBA recommendation"

      - name: client_nba_pitch
        description: "Cached personalized sales pitch proposals for customers with NBA recommendations"
        columns:
          - name: codice_cliente
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: raccomandazione_nba
            description: "Next Best Action recommendation (product bundle)"
          - name: pitch_suggestion
            description: "Pre-generated personalized sales pitch text"

  - name: raw
    description: "Raw CSV data loaded into DuckDB"
    schema: main
    tables:
      - name: clienti
        description: "Customer master data with demographics, financial info, and engagement metrics"
        columns:
          - name: codice_cliente
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
          - name: Nome
            description: "Customer first name"
          - name: Cognome
            description: "Customer last name"
          - name: Età
            description: "Customer age"
            tests:
              - not_null
          - name: Engagement_Score
            description: "Customer engagement score (0-100)"
          - name: Churn_Probability
            description: "Probability of customer churn (0-1)"
          - name: CLV_Stimato
            description: "Estimated customer lifetime value"

      - name: polizze
        description: "Insurance policies with premiums, coverage, and financial details"
        columns:
          - name: codice_cliente
            description: "Foreign key to clienti table"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: Prodotto
            description: "Insurance product name"
          - name: "Area di Bisogno"
            description: "Product category (Protezione, Risparmio e Investimento, etc.)"
          - name: Stato_Polizza
            description: "Policy status (Attiva, Scaduta, etc.)"
          - name: Premio_Totale_Annuo
            description: "Total annual premium"

      - name: sinistri
        description: "Insurance claims and settlements"
        columns:
          - name: codice_cliente
            description: "Foreign key to clienti table"
            tests:
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: Sinistro
            description: "Claim type or description"
          - name: Data_Sinistro
            description: "Date of claim"
          - name: Importo_Liquidato
            description: "Amount settled"
          - name: Stato_Liquidazione
            description: "Settlement status"

      - name: reclami
        description: "Customer complaints and inquiries"
        columns:
          - name: codice_cliente
            description: "Foreign key to clienti table"
            tests:
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: Reclami_e_info
            description: "Complaint or inquiry details"

      - name: abitazioni
        description: "Customer housing information"
        columns:
          - name: codice_cliente
            description: "Foreign key to clienti table"
            tests:
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: "Luogo di Residenza"
            description: "Place of residence"
          - name: Indirizzo
            description: "Street address"
          - name: Metratura
            description: "Property size in square meters"
          - name: Sistema_Allarme
            description: "Whether property has alarm system"

      - name: interazioni_clienti
        description: "Customer interactions with the company"
        columns:
          - name: codice_cliente
            description: "Foreign key to clienti table"
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'clienti')
                  field: codice_cliente
          - name: Data_Interazione
            description: "Date of interaction"
          - name: Tipo_Interazione
            description: "Type of interaction (Visita Agente, Chat Online, App Mobile, etc.)"
          - name: Motivo
            description: "Reason for interaction"
          - name: Esito
            description: "Outcome (Positivo, Negativo, Neutrale)"
          - name: Conversione
            description: "Whether interaction resulted in conversion"

      - name: competitor_prodotti
        description: "Competitor product information and market data"
        columns:
          - name: Competitor
            description: "Competitor name"
          - name: Tipo_Prodotto
            description: "Product type"
          - name: Premio_Medio
            description: "Average premium"
          - name: Rating_Clienti
            description: "Customer rating"
          - name: Quota_Mercato_Perc
            description: "Market share percentage"
